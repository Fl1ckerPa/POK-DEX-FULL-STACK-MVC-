<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex - Dashboard</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Tailwind Config -->
    <script src="../js/tailwind-config.js"></script>
    <!-- Styles -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/animations.css">
</head>
<body class="bg-cream font-inter min-h-screen">
    <div id="app" class="flex min-h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-white/50 backdrop-blur-md border-r border-black/5 flex-col hidden md:flex sticky top-0 h-screen">
            <div class="p-6">
                <div class="flex items-center gap-3 text-coral mb-8">
                    <div class="w-10 h-10 bg-coral rounded-xl flex items-center justify-center text-white">
                        <i data-lucide="zap" class="w-6 h-6"></i>
                    </div>
                    <span class="font-quicksand font-bold text-xl text-gray-800">Pokédex</span>
                </div>
                
                <nav class="space-y-2">
                    <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-coral/10 text-coral font-semibold transition-all">
                        <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                        Dashboard
                    </a>
                    <a href="favorites.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-black/5 hover:text-gray-900 transition-all">
                        <i data-lucide="heart" class="w-5 h-5"></i>
                        Favoritos
                    </a>
                    <a href="team.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-black/5 hover:text-gray-900 transition-all">
                        <i data-lucide="users" class="w-5 h-5"></i>
                        Minha Equipe
                    </a>
                    <a href="profile.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-black/5 hover:text-gray-900 transition-all">
                        <i data-lucide="user" class="w-5 h-5"></i>
                        Perfil
                    </a>
                </nav>
            </div>
            
            <div class="mt-auto p-6 border-t border-black/5">
                <button id="logout-btn" class="flex items-center gap-3 px-4 py-3 w-full rounded-xl text-red-500 hover:bg-red-50 transition-all font-semibold">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                    Sair
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col min-w-0">
            <!-- Top Bar -->
            <header class="sticky top-0 z-30 bg-cream/80 backdrop-blur-md border-b border-black/5 px-6 py-4 flex items-center justify-between">
                <div class="flex items-center gap-4 md:hidden">
                    <button id="mobile-menu-btn" class="p-2 hover:bg-black/5 rounded-lg transition-colors">
                        <i data-lucide="menu" class="w-6 h-6 text-gray-600"></i>
                    </button>
                    <span class="font-quicksand font-bold text-xl text-gray-800">Pokédex</span>
                </div>
                
                <div id="user-display" class="hidden md:flex items-center gap-3 ml-auto">
                    <div class="text-right">
                        <p id="user-name" class="text-sm font-semibold text-gray-800">Usuário</p>
                        <p id="user-email" class="text-xs text-gray-500">email@exemplo.com</p>
                    </div>
                    <div class="w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center text-gray-600 border-2 border-white shadow-sm overflow-hidden">
                        <i data-lucide="user" class="w-6 h-6"></i>
                    </div>
                </div>
            </header>

            <!-- Dashboard Content -->
            <div class="p-6 space-y-8 max-w-7xl mx-auto w-full">
                <!-- Search Section -->
                <div class="space-y-4">
                    <div class="relative w-full">
                        <i data-lucide="search" class="absolute left-5 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400"></i>
                        <input 
                            type="text" 
                            id="pokemon-search" 
                            placeholder="Search Pokémon by name or ID..." 
                            class="w-full pl-14 pr-6 py-4 bg-white border border-black/5 rounded-2xl shadow-sm focus:outline-none focus:ring-4 focus:ring-coral/10 focus:border-coral transition-all text-gray-800 text-lg placeholder:text-gray-400"
                        >
                    </div>
                    <div class="flex items-center justify-between px-2">
                        <p class="text-gray-600 font-medium">
                            <span id="result-count">0</span> Pokémon encontrados
                        </p>
                        <div class="flex items-center gap-2">
                            <!-- Filter buttons could go here -->
                        </div>
                    </div>
                </div>

                <!-- Pokémon Grid -->
                <div id="pokemon-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-6">
                    <!-- Cards will be injected here -->
                </div>

                <!-- Pagination -->
                <div id="pagination" class="flex justify-center items-center gap-2 pt-8 pb-12">
                    <!-- Pagination buttons will be injected here -->
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script type="module" src="../js/main.js"></script>
</body>
</html>
