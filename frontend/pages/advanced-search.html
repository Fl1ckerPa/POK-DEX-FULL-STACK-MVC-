<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex - Busca Avançada</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <!-- Tailwind Config -->
    <script src="../js/tailwind-config.js"></script>
    <!-- Styles -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/animations.css">
</head>
<body class="bg-cream font-inter min-h-screen">
    <div id="app" class="flex min-h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-white/50 backdrop-blur-md border-r border-black/5 flex-col hidden md:flex sticky top-0 h-screen">
            <div class="p-6">
                <div class="flex items-center gap-3 text-coral mb-8">
                    <div class="w-10 h-10 bg-coral rounded-xl flex items-center justify-center text-white">
                        <i data-lucide="zap" class="w-6 h-6"></i>
                    </div>
                    <span class="font-quicksand font-bold text-xl text-gray-800">Pokédex</span>
                </div>
                
                <p class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4 px-4">Menu</p>

                <nav class="space-y-2">
                    <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-black/5 hover:text-gray-900 transition-all">
                        <i data-lucide="home" class="w-5 h-5"></i>
                        Dashboard
                    </a>
                    <a href="advanced-search.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-coral bg-coral/10 font-bold transition-all shadow-sm shadow-coral/10">
                        <i data-lucide="search" class="w-5 h-5"></i>
                        Busca Avançada
                    </a>
                    <a href="favorites.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-black/5 hover:text-gray-900 transition-all">
                        <i data-lucide="heart" class="w-5 h-5"></i>
                        Favorites
                    </a>
                    <a href="team.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-black/5 hover:text-gray-900 transition-all">
                        <i data-lucide="users" class="w-5 h-5"></i>
                        Teams
                    </a>
                    <a href="history.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-black/5 hover:text-gray-900 transition-all">
                        <i data-lucide="clock" class="w-5 h-5"></i>
                        History
                    </a>
                    <a href="profile.html" class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-600 hover:bg-black/5 hover:text-gray-900 transition-all">
                        <i data-lucide="user" class="w-5 h-5"></i>
                        Profile
                    </a>
                </nav>
            </div>
            
            <div class="mt-auto p-6 border-t border-black/5">
                <a href="login.html" id="login-btn-sidebar" class="flex items-center gap-3 px-4 py-3 w-full rounded-xl text-coral hover:bg-coral/5 transition-all font-semibold">
                    <i data-lucide="log-in" class="w-5 h-5"></i>
                    Fazer Login
                </a>
                <button id="logout-btn-sidebar" class="flex items-center gap-3 px-4 py-3 w-full rounded-xl text-red-500 hover:bg-red-50 transition-all font-semibold hidden">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                    Sair
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col min-w-0">
            <header class="sticky top-0 z-30 bg-cream/80 backdrop-blur-md border-b border-black/5 py-4">
                <div class="max-w-7xl mx-auto px-6 flex items-center justify-between">
                    <h1 class="text-xl font-bold text-gray-800">Busca Avançada</h1>
                    
                    <!-- User Profile Header -->
                    <div class="user-profile-header flex items-center gap-3 hidden ml-auto">
                        <div class="text-right hidden sm:block">
                            <p id="user-name" class="text-sm font-semibold text-gray-800 leading-none"></p>
                            <p id="user-email" class="text-xs text-gray-500 mt-1"></p>
                        </div>
                        <div class="w-10 h-10 bg-gray-200 rounded-full flex items-center justify-center text-gray-600 border-2 border-white shadow-sm overflow-hidden">
                            <i data-lucide="user" class="w-6 h-6"></i>
                        </div>
                    </div>
                </div>
            </header>

            <div class="p-6 space-y-8 max-w-7xl mx-auto w-full">
                <!-- Search Bar -->
                <div class="glass-card p-4">
                    <div class="flex items-center gap-3 px-4 py-2 bg-white rounded-2xl border border-black/5 focus-within:ring-2 focus-within:ring-coral/20 transition-all">
                        <i data-lucide="search" class="w-5 h-5 text-gray-400"></i>
                        <input type="text" id="search-input" placeholder="Buscar por nome ou ID..." 
                               class="w-full bg-transparent border-none focus:outline-none text-gray-800 font-medium placeholder:text-gray-400">
                    </div>
                </div>

                <!-- Filters -->
                <div class="glass-card p-8 space-y-10">
                    <!-- Type Filter -->
                    <div class="space-y-6">
                        <h3 class="text-sm font-bold text-slate-400 uppercase tracking-widest">Filter by Type</h3>
                        <div id="type-pills" class="flex flex-wrap gap-3">
                            <button class="type-pill-btn px-6 py-2.5 rounded-full text-sm font-bold transition-all bg-slate-200 text-slate-500 hover:scale-105 active:scale-95 border-2 border-transparent" data-type="normal">Normal</button>
                            <button class="type-pill-btn px-6 py-2.5 rounded-full text-sm font-bold transition-all bg-orange-200 text-orange-700 hover:scale-105 active:scale-95 border-2 border-transparent" data-type="fire">Fire</button>
                            <button class="type-pill-btn px-6 py-2.5 rounded-full text-sm font-bold transition-all bg-blue-200 text-blue-700 hover:scale-105 active:scale-95 border-2 border-transparent" data-type="water">Water</button>
                            <button class="type-pill-btn px-6 py-2.5 rounded-full text-sm font-bold transition-all bg-emerald-200 text-emerald-700 hover:scale-105 active:scale-95 border-2 border-transparent" data-type="grass">Grass</button>
                            <button class="type-pill-btn px-6 py-2.5 rounded-full text-sm font-bold transition-all bg-yellow-200 text-yellow-700 hover:scale-105 active:scale-95 border-2 border-transparent" data-type="electric">Electric</button>
                            <button class="type-pill-btn px-6 py-2.5 rounded-full text-sm font-bold transition-all bg-cyan-100 text-cyan-700 hover:scale-105 active:scale-95 border-2 border-transparent" data-type="ice">Ice</button>
                            <button class="type-pill-btn px-6 py-2.5 rounded-full text-sm font-bold transition-all bg-red-200 text-red-700 hover:scale-105 active:scale-95 border-2 border-transparent" data-type="fighting">Fighting</button>
                            <button class="type-pill-btn px-6 py-2.5 rounded-full text-sm font-bold transition-all bg-purple-200 text-purple-700 hover:scale-105 active:scale-95 border-2 border-transparent" data-type="poison">Poison</button>
                            <button class="type-pill-btn px-6 py-2.5 rounded-full text-sm font-bold transition-all bg-amber-200 text-amber-800 hover:scale-105 active:scale-95 border-2 border-transparent" data-type="ground">Ground</button>
                            <button class="type-pill-btn px-6 py-2.5 rounded-full text-sm font-bold transition-all bg-indigo-200 text-indigo-700 hover:scale-105 active:scale-95 border-2 border-transparent" data-type="flying">Flying</button>
                            <button class="type-pill-btn px-6 py-2.5 rounded-full text-sm font-bold transition-all bg-pink-200 text-pink-700 hover:scale-105 active:scale-95 border-2 border-transparent" data-type="psychic">Psychic</button>
                            <button class="type-pill-btn px-6 py-2.5 rounded-full text-sm font-bold transition-all bg-lime-200 text-lime-700 hover:scale-105 active:scale-95 border-2 border-transparent" data-type="bug">Bug</button>
                            <button class="type-pill-btn px-6 py-2.5 rounded-full text-sm font-bold transition-all bg-stone-300 text-stone-700 hover:scale-105 active:scale-95 border-2 border-transparent" data-type="rock">Rock</button>
                            <button class="type-pill-btn px-6 py-2.5 rounded-full text-sm font-bold transition-all bg-violet-200 text-violet-700 hover:scale-105 active:scale-95 border-2 border-transparent" data-type="ghost">Ghost</button>
                            <button class="type-pill-btn px-6 py-2.5 rounded-full text-sm font-bold transition-all bg-purple-300 text-purple-900 hover:scale-105 active:scale-95 border-2 border-transparent" data-type="dragon">Dragon</button>
                            <button class="type-pill-btn px-6 py-2.5 rounded-full text-sm font-bold transition-all bg-slate-600 text-slate-100 hover:scale-105 active:scale-95 border-2 border-transparent" data-type="dark">Dark</button>
                            <button class="type-pill-btn px-6 py-2.5 rounded-full text-sm font-bold transition-all bg-slate-300 text-slate-600 hover:scale-105 active:scale-95 border-2 border-transparent" data-type="steel">Steel</button>
                            <button class="type-pill-btn px-6 py-2.5 rounded-full text-sm font-bold transition-all bg-rose-100 text-rose-500 hover:scale-105 active:scale-95 border-2 border-transparent" data-type="fairy">Fairy</button>
                        </div>
                    </div>

                    <!-- Region Filter -->
                    <div class="space-y-6">
                        <h3 class="text-sm font-bold text-slate-400 uppercase tracking-widest">Filter by Region</h3>
                        <div id="region-pills" class="flex items-center gap-3 overflow-x-auto pb-4 scrollbar-hide">
                            <button class="region-pill-btn px-8 py-3 rounded-full text-sm font-bold transition-all bg-coral text-white shadow-lg shadow-coral/30 active whitespace-nowrap" data-region="">All</button>
                            <button class="region-pill-btn px-8 py-3 rounded-full text-sm font-bold transition-all bg-slate-100 text-slate-500 hover:bg-slate-200 whitespace-nowrap" data-region="1-151">Kanto</button>
                            <button class="region-pill-btn px-8 py-3 rounded-full text-sm font-bold transition-all bg-slate-100 text-slate-500 hover:bg-slate-200 whitespace-nowrap" data-region="152-251">Johto</button>
                            <button class="region-pill-btn px-8 py-3 rounded-full text-sm font-bold transition-all bg-slate-100 text-slate-500 hover:bg-slate-200 whitespace-nowrap" data-region="252-386">Hoenn</button>
                            <button class="region-pill-btn px-8 py-3 rounded-full text-sm font-bold transition-all bg-slate-100 text-slate-500 hover:bg-slate-200 whitespace-nowrap" data-region="387-493">Sinnoh</button>
                            <button class="region-pill-btn px-8 py-3 rounded-full text-sm font-bold transition-all bg-slate-100 text-slate-500 hover:bg-slate-200 whitespace-nowrap" data-region="494-649">Unova</button>
                            <button class="region-pill-btn px-8 py-3 rounded-full text-sm font-bold transition-all bg-slate-100 text-slate-500 hover:bg-slate-200 whitespace-nowrap" data-region="650-721">Kalos</button>
                            <button class="region-pill-btn px-8 py-3 rounded-full text-sm font-bold transition-all bg-slate-100 text-slate-500 hover:bg-slate-200 whitespace-nowrap" data-region="722-809">Alola</button>
                            <button class="region-pill-btn px-8 py-3 rounded-full text-sm font-bold transition-all bg-slate-100 text-slate-500 hover:bg-slate-200 whitespace-nowrap" data-region="810-898">Galar</button>
                            <button class="region-pill-btn px-8 py-3 rounded-full text-sm font-bold transition-all bg-slate-100 text-slate-500 hover:bg-slate-200 whitespace-nowrap" data-region="899-1010">Paldea</button>
                        </div>
                    </div>

                    <div class="pt-4 flex flex-col md:flex-row items-center gap-4">
                        <div class="flex items-center gap-3 bg-slate-100 p-1 rounded-2xl border border-black/5 w-full md:w-auto">
                            <span class="text-xs font-bold text-slate-400 uppercase tracking-widest ml-3 mr-2">Mostrar:</span>
                            <button class="limit-btn px-4 py-2 rounded-xl text-xs font-bold transition-all bg-white text-coral shadow-sm active" data-limit="20">20</button>
                            <button class="limit-btn px-4 py-2 rounded-xl text-xs font-bold transition-all text-slate-500 hover:bg-white/50" data-limit="50">50</button>
                            <button class="limit-btn px-4 py-2 rounded-xl text-xs font-bold transition-all text-slate-500 hover:bg-white/50" data-limit="100">100</button>
                        </div>
                        <button id="search-btn" class="flex-1 py-4 bg-coral text-white rounded-2xl font-bold shadow-xl shadow-coral/20 hover:scale-[1.01] active:scale-95 transition-all flex items-center justify-center gap-3 text-lg">
                            <i data-lucide="search" class="w-6 h-6"></i>
                            Filtrar Pokémon
                        </button>
                    </div>
                </div>

                <!-- Results Grid -->
                <div id="pokemon-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-6"></div>

                <!-- Pagination -->
                <div id="pagination" class="flex justify-center items-center gap-2 py-8"></div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script type="module" src="../js/auth.js"></script>
    <script type="module">
        import api from '../js/api.js';
        import ui from '../js/ui.js';
        import auth from '../js/auth.js';

        // Initial setup
        const searchBtn = document.getElementById('search-btn');
        const typeBtns = document.querySelectorAll('.type-pill-btn');
        const regionBtns = document.querySelectorAll('.region-pill-btn');
        const limitBtns = document.querySelectorAll('.limit-btn');
        const searchInput = document.getElementById('search-input');

        let selectedTypes = new Set();
        let selectedRegions = new Set();
        let currentLimit = 20;
        let currentPage = 1;

        // Handle Limit Selection
        limitBtns.forEach(btn => {
            btn.onclick = () => {
                limitBtns.forEach(b => {
                    b.classList.remove('bg-white', 'text-coral', 'shadow-sm', 'active');
                    b.classList.add('text-slate-500', 'hover:bg-white/50');
                });
                btn.classList.remove('text-slate-500', 'hover:bg-white/50');
                btn.classList.add('bg-white', 'text-coral', 'shadow-sm', 'active');
                currentLimit = parseInt(btn.dataset.limit);
            };
        });

        // Handle Type Pills (Multiple Selection)
        typeBtns.forEach(btn => {
            btn.onclick = () => {
                const type = btn.dataset.type;
                if (selectedTypes.has(type)) {
                    selectedTypes.delete(type);
                    btn.classList.remove('active', 'ring-4', 'ring-coral/20', 'scale-105');
                    btn.classList.add('border-transparent');
                } else {
                    selectedTypes.add(type);
                    btn.classList.add('active', 'ring-4', 'ring-coral/20', 'scale-105');
                    btn.classList.remove('border-transparent');
                }
            };
        });

        // Handle Region Pills (Multiple Selection)
        regionBtns.forEach(btn => {
            btn.onclick = () => {
                const region = btn.dataset.region;
                
                if (region === "") { // Botão "All"
                    selectedRegions.clear();
                    regionBtns.forEach(b => {
                        b.classList.remove('bg-coral', 'text-white', 'shadow-lg', 'shadow-coral/30', 'active');
                        b.classList.add('bg-slate-100', 'text-slate-500', 'hover:bg-slate-200');
                    });
                    btn.classList.remove('bg-slate-100', 'text-slate-500', 'hover:bg-slate-200');
                    btn.classList.add('bg-coral', 'text-white', 'shadow-lg', 'shadow-coral/30', 'active');
                } else {
                    // Desmarcar "All" se clicar em uma região específica
                    const allBtn = Array.from(regionBtns).find(b => b.dataset.region === "");
                    allBtn.classList.remove('bg-coral', 'text-white', 'shadow-lg', 'shadow-coral/30', 'active');
                    allBtn.classList.add('bg-slate-100', 'text-slate-500', 'hover:bg-slate-200');

                    if (selectedRegions.has(region)) {
                        selectedRegions.delete(region);
                        btn.classList.remove('bg-coral', 'text-white', 'shadow-lg', 'shadow-coral/30', 'active');
                        btn.classList.add('bg-slate-100', 'text-slate-500', 'hover:bg-slate-200');
                        
                        // Se não sobrar nenhuma região, volta para "All"
                        if (selectedRegions.size === 0) {
                            allBtn.classList.add('bg-coral', 'text-white', 'shadow-lg', 'shadow-coral/30', 'active');
                            allBtn.classList.remove('bg-slate-100', 'text-slate-500', 'hover:bg-slate-200');
                        }
                    } else {
                        selectedRegions.add(region);
                        btn.classList.add('bg-coral', 'text-white', 'shadow-lg', 'shadow-coral/30', 'active');
                        btn.classList.remove('bg-slate-100', 'text-slate-500', 'hover:bg-slate-200');
                    }
                }
            };
        });

        const performSearch = async (page = 1) => {
            currentPage = page;
            ui.showLoading();
            
            // Endpoint com paginação e limite customizado
            let endpoint = `/pokemon?page=${currentPage}&limit=${currentLimit}`;
            
            const searchQuery = searchInput.value.trim();
            if (searchQuery) {
                endpoint += `&search=${encodeURIComponent(searchQuery)}`;
            }

            if (selectedRegions.size > 0) {
                const regionsArray = Array.from(selectedRegions).map(r => {
                    const [start, end] = r.split('-');
                    return { start: parseInt(start), end: parseInt(end) };
                });
                endpoint += `&regions=${JSON.stringify(regionsArray)}`;
            }

            if (selectedTypes.size > 0) {
                const typesArray = Array.from(selectedTypes);
                endpoint += `&types=${JSON.stringify(typesArray)}`;
            }

            try {
                const res = await api.get(endpoint);
                if (res.success) {
                    let data = res.data;
                    
                    ui.renderPokemonGrid(data);
                    
                    // Renderizar Paginação com total real do backend
                    ui.renderPagination(currentPage, res.totalPages, (newPage) => {
                        performSearch(newPage);
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    });
                    
                    // Atualizar contador de resultados
                    const countHeader = document.querySelector('header h1');
                    if (countHeader) {
                        countHeader.innerHTML = `Busca Avançada <span class="ml-2 px-3 py-1 bg-coral/10 text-coral text-xs rounded-full">${res.total} encontrados</span>`;
                    }
                }
            } catch (err) {
                ui.showError(err.message);
            }
        };

        searchBtn.onclick = () => performSearch(1);

        // Adicionar suporte a Enter no campo de busca
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchBtn.click();
        });

        // Adicionar suporte a Enter no campo de busca
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchBtn.click();
        });

        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();
            
            // Initial user display
            const userJson = localStorage.getItem('user');
            const userProfileHeader = document.querySelector('.user-profile-header');
            const loginBtnSidebar = document.getElementById('login-btn-sidebar');
            const logoutBtnSidebar = document.getElementById('logout-btn-sidebar');

            if (userJson) {
                const user = JSON.parse(userJson);
                const userEmail = document.getElementById('user-email');
                const userName = document.getElementById('user-name');
                if (userEmail) userEmail.innerText = user.email;
                if (userName) userName.innerText = user.username;
                
                if (userProfileHeader) userProfileHeader.classList.remove('hidden');
                if (loginBtnSidebar) loginBtnSidebar.classList.add('hidden');
                if (logoutBtnSidebar) logoutBtnSidebar.classList.remove('hidden');
            } else {
                if (userProfileHeader) userProfileHeader.classList.add('hidden');
                if (loginBtnSidebar) loginBtnSidebar.classList.remove('hidden');
                if (logoutBtnSidebar) logoutBtnSidebar.classList.add('hidden');
            }

            // Logout listener
            const logoutBtn = document.getElementById('logout-btn-sidebar');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', () => {
                    auth.logout();
                });
            }
        });
    </script>
</body>
</html>
