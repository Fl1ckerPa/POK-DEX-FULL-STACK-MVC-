<!DOCTYPE html> 
<html lang="pt-BR"> 
<head> 
  <meta charset="UTF-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>Detalhes do Pokémon</title> 
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <!-- Tailwind Config -->
  <script src="../js/tailwind-config.js"></script>
  <!-- Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/animations.css">
</head> 
<body class="bg-cream dark:bg-gray-900 min-h-screen font-body text-gray-800 dark:text-gray-200"> 
 
  <header class="sticky top-0 z-20 bg-cream/80 dark:bg-gray-900/80 backdrop-blur-md 
                 border-b border-gray-200 dark:border-gray-700 px-4 py-3 flex items-center gap-3"> 
    <button onclick="history.back()" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors"> 
      <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"> 
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/> 
      </svg> 
    </button> 
    <span class="font-display font-bold text-gray-400 pokemon-number"></span> 
    <h1 class="font-display font-bold text-lg capitalize pokemon-name"></h1> 
    <button id="favorite-btn" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors ml-auto favorite-btn">
      <i data-lucide="heart" class="w-6 h-6 text-gray-400"></i>
    </button>
  </header> 
 
  <main class="max-w-2xl mx-auto px-4 pt-6 pb-12 space-y-6"> 
    <!-- Hero --> 
    <section class="glass-card p-8 text-center opacity-0 animate-fade-slide-up delay-100"> 
      <div class="h-56 w-56 mx-auto rounded-full bg-gray-100 dark:bg-gray-800/50 flex items-center justify-center"> 
        <img class="h-48 w-48 object-contain drop-shadow-xl pokemon-image" src="" alt=""> 
      </div> 
      <h2 class="font-display font-bold text-3xl capitalize mt-4 pokemon-title"></h2> 
      <div class="flex justify-center gap-2 mt-3 types"></div> 
      <div class="mt-5"> 
        <button class="cry-btn rounded-full h-12 px-8 font-display font-bold 
                       bg-[#4FD1C5] hover:bg-[#38B2AC] text-white shadow-lg shadow-teal-500/20
                       transition-all inline-flex items-center gap-2 active:scale-95"> 
          <span class="cry-icon-container">
            <i data-lucide="volume-2" class="w-5 h-5"></i>
          </span> 
          <span class="cry-text">Ouvir Som</span> 
        </button> 
      </div> 
    </section> 
 
    <!-- Físico --> 
    <section class="grid grid-cols-2 gap-3 opacity-0 animate-fade-slide-up delay-200"> 
      <div class="glass-card p-4 text-center"> 
        <i data-lucide="ruler" class="w-6 h-6 text-coral mx-auto mb-1"></i>
        <p class="text-xs text-gray-500 font-body">Altura</p> 
        <p class="font-display font-bold text-xl height-value"></p> 
      </div> 
      <div class="glass-card p-4 text-center"> 
        <i data-lucide="weight" class="w-6 h-6 text-coral mx-auto mb-1"></i>
        <p class="text-xs text-gray-500 font-body">Peso</p> 
        <p class="font-display font-bold text-xl weight-value"></p> 
      </div> 
    </section> 
 
    <!-- Abilities --> 
    <section class="glass-card p-5 opacity-0 animate-fade-slide-up" style="animation-delay: 0.3s"> 
      <div class="flex items-center gap-2 mb-4"> 
        <i data-lucide="sparkles" class="w-5 h-5 text-coral"></i>
        <h3 class="font-display font-bold text-sm text-gray-500 dark:text-gray-400 uppercase tracking-wide"> 
          Habilidades 
        </h3> 
      </div> 
      <div class="space-y-3 abilities-detailed"></div> 
    </section> 
 
    <!-- Evolution Chain -->
    <section class="glass-card p-5 opacity-0 animate-fade-slide-up" style="animation-delay: 0.4s"> 
      <div class="flex items-center gap-2 mb-5"> 
        <i data-lucide="git-branch" class="w-5 h-5 text-coral"></i>
        <h3 class="font-display font-bold text-sm text-gray-500 dark:text-gray-400 uppercase tracking-wide"> 
          Cadeia de Evolução 
        </h3> 
      </div> 
      <div class="flex items-center justify-center flex-wrap gap-2 evolution-chain"></div> 
    </section>

    <!-- Stats --> 
    <section class="glass-card p-5 opacity-0 animate-fade-slide-up" style="animation-delay: 0.5s"> 
      <h3 class="font-display font-bold text-sm text-gray-500 mb-4 uppercase tracking-wide">Estatísticas Base</h3> 
      <div class="space-y-3 stats"></div> 
      <div class="mt-4 pt-3 border-t border-gray-200 dark:border-gray-700 flex justify-between"> 
        <span class="font-display font-bold text-sm text-gray-500 uppercase tracking-wide">Total</span> 
        <span class="font-display font-bold text-lg stat-total"></span> 
      </div> 
    </section> 

    <!-- Moves -->
    <section class="glass-card p-5 opacity-0 animate-fade-slide-up" style="animation-delay: 0.6s"> 
      <div class="flex items-center gap-2 mb-4"> 
        <i data-lucide="swords" class="w-5 h-5 text-coral"></i>
        <h3 class="font-display font-bold text-sm text-gray-500 dark:text-gray-400 uppercase tracking-wide"> 
          Ataques 
        </h3> 
        <span class="text-xs text-gray-400 dark:text-gray-500 ml-auto moves-count"></span> 
      </div> 
     
      <!-- Filtros --> 
      <div class="flex flex-wrap gap-1.5 mb-4 moves-filters"></div> 
     
      <!-- Tabela --> 
      <div class="overflow-x-auto"> 
        <table class="w-full text-sm"> 
          <thead> 
            <tr class="border-b border-gray-200 dark:border-gray-700 text-left"> 
              <th class="pb-2 font-medium text-gray-500 dark:text-gray-400 text-xs uppercase tracking-wide">Ataque</th> 
              <th class="pb-2 font-medium text-gray-500 dark:text-gray-400 text-xs uppercase tracking-wide">Tipo</th> 
              <th class="pb-2 font-medium text-gray-500 dark:text-gray-400 text-xs uppercase tracking-wide text-center">Pwr</th> 
              <th class="pb-2 font-medium text-gray-500 dark:text-gray-400 text-xs uppercase tracking-wide text-center">Acc</th> 
              <th class="pb-2 font-medium text-gray-500 dark:text-gray-400 text-xs uppercase tracking-wide text-center">PP</th> 
              <th class="pb-2 font-medium text-gray-500 dark:text-gray-400 text-xs uppercase tracking-wide">Classe</th> 
            </tr> 
          </thead> 
          <tbody class="moves-table-body"></tbody> 
        </table> 
      </div> 
     
      <!-- Botão expandir --> 
      <div class="moves-expand-container hidden"> 
        <button class="moves-expand-btn w-full mt-3 py-2 flex items-center justify-center gap-1 
                       text-sm font-medium text-coral hover:text-coral/80 transition-colors"> 
        </button> 
      </div> 
    </section>

    <!-- Game Appearances -->
    <section class="glass-card p-5 opacity-0 animate-fade-slide-up" style="animation-delay: 0.7s"> 
      <div class="flex items-center gap-2 mb-4"> 
        <i data-lucide="gamepad-2" class="w-5 h-5 text-coral"></i>
        <h3 class="font-display font-bold text-sm text-gray-500 dark:text-gray-400 uppercase tracking-wide"> 
          Aparições nos Jogos 
        </h3> 
        <span class="text-xs text-gray-400 dark:text-gray-500 ml-auto versions-count"></span> 
      </div> 
      <div class="space-y-4 versions-container"></div> 
    </section>
  </main> 
 
  <script src="../js/details.js" type="module"></script> 
</body> 
</html>
